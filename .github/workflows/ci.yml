name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: pip install mfem scikit-build-core pybind11 ninja pytest
      - run: pip install -e . --no-build-isolation
      - run: pytest .

name: Clang Format Check

on:
  [push, pull_request]

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Clang Format Linter
        uses: RafikFarhad/clang-format-github-action@v6
        with:
          # Select which files/folders to lint
          sources: "src/**/*.h,src/**/*.cpp,include/**/*.h"
          # Select formatting style (file reads your local .clang-format)
          style: "file" 
