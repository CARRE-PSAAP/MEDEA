[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "medea"
version = "0.0.0"
description = "Tools for solving particle transport problems using MFEM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mfem>=4.10", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "black<27"]
# Parallel PyMFEM cannot be requested through pip extras; it is a source build.
# See README for instructions. mpi4py is needed at runtime in that case.
parallel = ["mpi4py"]
docs = ["sphinx", "breathe", "sphinx-rtd-theme"]

[tool.scikit-build]
wheel.packages = ["medea"]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
editable.mode = "redirect"

[tool.scikit-build.cmake.define]
# Override with: pip install -e . --no-build-isolation -Ccmake.define.MEDEA_MFEM_MODE=par
# or the environment variable MEDEA_MFEM_MODE=par
MEDEA_MFEM_MODE = "ser"

[tool.pytest.ini_options]
testpaths = ["tests"]
