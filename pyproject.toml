[build-system]
# MFEM is deliberately NOT listed here: the extension must link against the
# PyMFEM installed in the user's environment. Build with --no-build-isolation
# (see README), after installing the build requirements below.
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "medea"
version = "0.0.0"
description = "Tools for solving particle transport problems using MFEM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mfem>=4.10", "numpy"]

[project.optional-dependencies]
test = ["pytest"]
# Parallel PyMFEM cannot be requested through pip extras; it is a source build.
# See README for the recipe. mpi4py is needed at runtime in that case.
parallel = ["mpi4py"]

[tool.scikit-build]
wheel.packages = ["medea"]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
editable.mode = "redirect"

[tool.scikit-build.cmake.define]
# Override with: pip install -e . --no-build-isolation -Ccmake.define.MEDEA_MFEM_MODE=par
# or the environment variable MEDEA_MFEM_MODE=par
MEDEA_MFEM_MODE = "ser"

[tool.pytest.ini_options]
testpaths = ["tests"]
